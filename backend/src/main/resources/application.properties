spring.application.name=cropcare

# ── Database Configuration (Works with Local MySQL, Cloud MySQL, or Render DB) ──
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cropcare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:babu}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# ── Server Port (Render automatically injects PORT) ──
server.port=${PORT:8080}

# ── JWT ──
jwt.secret=${JWT_SECRET:cropcare_super_secret_key_2026_minimum_32_characters_long}
jwt.expiration=604800000

# ── File Upload ──
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging ──
logging.level.com.example.crop=INFO
logging.level.org.springframework.security=WARN

# ── Static Resources ──
spring.web.resources.static-locations=classpath:/static/cropcare/,classpath:/static/
